name: Tokei
options:
  bundleIdPrefix: com.wormadev
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4BHH38RCA7
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Tokei:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - sdk: libsqlite3.tbd
    scheme:
      testTargets: [TokeiTests]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Tokei
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wormadev.Tokei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  TokeiTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Tokei
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wormadev.TokeiTests
