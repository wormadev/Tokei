name: Release

# Every merge that changes the app ships a patch release: scripts/release.sh picks the version,
# builds, signs, publishes the GitHub release and appcast, and bumps the Homebrew cask.
on:
  push:
    branches: [main]
    paths: ["Sources/**", "project.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish (off: build, sign and verify only)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD SPARKLE_ED_KEY RELEASE_TOKEN NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            [[ -n "${!name}" ]] || { echo "::error::Repo secret $name is not set"; missing=1; }
          done
          exit $missing

      # Build number is main's commit count and the version comes from tags: full history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # Pinned release zip: brew always installs the latest.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Sparkle key
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key" >> "$GITHUB_ENV"

      - name: Notary key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary_key.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"

      - name: Release
        env:
          # Also pushes the cask to wormadev/homebrew-tap, which GITHUB_TOKEN can't reach. release.sh
          # unexports it and hands it only to gh and git push.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GH_TOKEN="$RELEASE_TOKEN" gh auth setup-git
          if [[ "$PUBLISH" == true ]]; then
            scripts/release.sh --publish
          else
            # Placeholder notes: a dry run may have no feat/fix commits to generate them from.
            echo "- Dry run" > "$RUNNER_TEMP/notes.md"
            scripts/release.sh --notes "$RUNNER_TEMP/notes.md"
          fi

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle_ed_key" "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
